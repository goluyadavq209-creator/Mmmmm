name: Build Debug APK & Publish GitHub Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm AGP 9.1.1 in version catalog
        run: |
          if ! grep -Eq '^\s*agp\s*=\s*"9\.1\.1"' gradle/libs.versions.toml; then
            echo "::error::Expected AGP 9.1.1 in gradle/libs.versions.toml"
            exit 1
          fi
          echo "Confirmed AGP 9.1.1 in gradle/libs.versions.toml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java 17 version
        run: |
          java -version
          javac -version
          JAVA_VER="$(java -version 2>&1 | head -n 1)"
          if ! echo "$JAVA_VER" | grep -q '"17\.'; then
            echo "::error::Active Java version is not 17: $JAVA_VER"
            exit 1
          fi
          echo "Verified active Java version: $JAVA_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle 9.3.1
        run: |
          gradle --version
          if ! gradle --version | grep -q 'Gradle 9.3.1'; then
            echo "::error::Expected Gradle 9.3.1 on PATH"
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        id: build_apk
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Remove temporary debug keystore
        if: always()
        run: |
          rm -f debug.keystore

      - name: Verify APK and prepare release asset metadata
        id: prepare_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Verified debug APK not found or empty at $APK_PATH"
            exit 1
          fi

          RELEASE_TAG="apk-debug-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="ClipGenius AI Debug APK (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT})"
          ASSET_FILENAME="clipgenius-ai-debug-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}.apk"
          RELEASE_APK_PATH="${RUNNER_TEMP}/${ASSET_FILENAME}"

          cp "$APK_PATH" "$RELEASE_APK_PATH"
          APK_SIZE="$(du -h "$APK_PATH" | cut -f1)"

          {
            echo "apk_path=${APK_PATH}"
            echo "apk_size=${APK_SIZE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
            echo "asset_filename=${ASSET_FILENAME}"
            echo "release_apk_path=${RELEASE_APK_PATH}"
          } >> "$GITHUB_OUTPUT"

          echo "Verified debug APK at ${APK_PATH} (${APK_SIZE})"

      - name: Upload Actions APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK asset
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_apk.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_apk.outputs.release_title }}
          RELEASE_APK_PATH: ${{ steps.prepare_apk.outputs.release_apk_path }}
        run: |
          RELEASE_NOTES=$(cat <<'EOF'
          Automated Android Debug APK build from GitHub Actions.

          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.

          Download the `.apk` file directly from the **Assets** section below to install on an Android device for testing.
          EOF
          )

          gh release create "$RELEASE_TAG" "$RELEASE_APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_apk_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_apk.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_apk.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_apk.outputs.asset_filename }}
          APK_SIZE: ${{ steps.prepare_apk.outputs.apk_size }}
        run: |
          if [ "$BUILD_OUTCOME" != "success" ] || [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "::warning::APK build or artifact upload did not complete successfully."
            {
              echo "## APK Build Summary"
              echo ""
              echo "- Build outcome: \`${BUILD_OUTCOME}\`"
              echo "- Artifact upload outcome: \`${ARTIFACT_OUTCOME}\`"
              echo "- Release publishing outcome: \`${RELEASE_OUTCOME}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Verified GitHub Release:"
            gh release view "$RELEASE_TAG"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"

            {
              echo "## APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Direct GitHub Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\` (${APK_SIZE})"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the APK build and Actions artifact upload succeeded. Download the backup artifact named 'app-debug-apk' from this workflow run."
            echo "APK build succeeded (${APK_SIZE})."
            echo "Backup Actions artifact available: app-debug-apk"

            {
              echo "## APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed. No release URL was created."
              echo ""
              echo "- **APK Build:** Succeeded (${APK_SIZE})"
              echo "- **Actions Artifact Backup:** \`app-debug-apk\` is uploaded and available on this workflow run."
              echo ""
              echo "You can download the APK from the **Artifacts** section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
